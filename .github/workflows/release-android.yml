name: Release Android

# Builds a signed app bundle and uploads it to Google Play.
#   - Push a tag like `v1.0.1` to release that version to the internal track.
#   - Or run it by hand from the Actions tab and pick the track.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON  Google Play API service account key (JSON)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload to
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9   # keep in step with .fvmrc
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD:  ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:       ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:    ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v"; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/android/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # Play needs every upload to have a higher version code than the last one;
      # the run number only ever goes up. The version name comes from the tag
      # (v1.2.3 -> 1.2.3), or from pubspec.yaml for a manual run.
      - name: Build app bundle
        run: |
          NAME_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME_ARG="--build-name=${GITHUB_REF_NAME#v}"
          fi
          flutter build appbundle --release \
            --build-number="$GITHUB_RUN_NUMBER" $NAME_ARG \
            --obfuscate --split-debug-info=build/symbols

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.crn.usync
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed

      - name: Keep the bundle and obfuscation symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.run_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols
          if-no-files-found: ignore
          retention-days: 90

      - name: Remove signing files
        if: always()
        run: rm -f android/upload.jks android/key.properties
