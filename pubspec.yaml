name: usync
description: "Usync — A realtime emotional connection app for couples."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # ── Navigation ────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Dependency injection ──────────────────────────────────────
  get_it: ^8.0.0

  # ── Firebase ──────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # ── Local storage ─────────────────────────────────────────────
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # ── Fonts ─────────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── Images ────────────────────────────────────────────────────
  cached_network_image: ^3.4.1

  # ── Haptics ───────────────────────────────────────────────────
  vibration: ^2.0.0

  # ── Sharing / saving ──────────────────────────────────────────
  share_plus: ^10.0.2

  # ── Utilities ─────────────────────────────────────────────────
  uuid: ^4.5.1
  intl: ^0.19.0
  rxdart: ^0.28.0

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  geolocator: ^14.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#1A0533"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

flutter:
  uses-material-design: true
